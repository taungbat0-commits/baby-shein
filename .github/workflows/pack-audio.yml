name: Generate Pack Audio (EN + MY)

on:
  push:
    branches: [ main ]
    paths:
      - 'content_packs/*.json'
      - 'scripts/generate_pack_audio.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pack-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TTS tools
        run: |
          sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
          pip install --quiet edge-tts

      - name: Generate EN + MY MP3 files for all content packs
        run: python3 scripts/generate_pack_audio.py

      - name: Commit generated MP3s to content_packs/audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_packs/audio
          if ! git diff --cached --quiet; then
            git commit -m "Auto-generate EN+MY pack audio [skip ci]"
            git push
          else
            echo "No new pack audio files to commit."
          fi
