name: Build Baby Shein APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'content_packs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Set up Python for offline audio bundling
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure asset directories exist
        run: |
          mkdir -p assets/data assets/audio assets/images assets/animations
          touch assets/audio/.gitkeep assets/images/.gitkeep assets/animations/.gitkeep

      - name: Generate bundled offline audio files
        run: |
          sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
          pip install --quiet edge-tts
          python3 scripts/generate_audio.py

      - name: Setup Android Gradle 8.7 Wrapper and Base Icons
        run: |
          mkdir -p /tmp/flutter_scaffold
          cd /tmp/flutter_scaffold
          flutter create --platforms=android --org com.ngashein --project-name baby_shein .
          cp /tmp/flutter_scaffold/android/gradlew "${GITHUB_WORKSPACE}/android/gradlew"
          chmod +x "${GITHUB_WORKSPACE}/android/gradlew"
          mkdir -p "${GITHUB_WORKSPACE}/android/gradle/wrapper"
          cp -r /tmp/flutter_scaffold/android/gradle/wrapper/* "${GITHUB_WORKSPACE}/android/gradle/wrapper/"
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip\n' > "${GITHUB_WORKSPACE}/android/gradle/wrapper/gradle-wrapper.properties"
          for dir in /tmp/flutter_scaffold/android/app/src/main/res/mipmap-*; do
            base=$(basename "$dir")
            if [ ! -d "${GITHUB_WORKSPACE}/android/app/src/main/res/${base}" ]; then
              cp -r "$dir" "${GITHUB_WORKSPACE}/android/app/src/main/res/"
            fi
          done
          cd "${GITHUB_WORKSPACE}"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Baby Shein App Launcher Icon
        run: |
          if [ -f "assets/images/baby.png" ]; then
            dart run flutter_launcher_icons
          else
            echo "baby.png missing, using default launcher icon"
          fi

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/release-keystore.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n" \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build Signed Release APK
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${VERSION_CODE}"
          echo "Building Baby Shein v${VERSION_NAME} (${VERSION_CODE})"
          flutter build apk --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${VERSION_CODE}" \
            --dart-define=APP_VERSION="${VERSION_NAME}" \
          --dart-define=APP_VERSION_CODE="${VERSION_CODE}"

      - name: Verify APK output
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baby-shein-v1.0.${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release & Update Catalog
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${VERSION_CODE}"
          TAG="v${VERSION_NAME}"
          APK_OUT="baby-shein-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_OUT"

          gh release create "$TAG" "$APK_OUT" \
            --title "Baby Shein ${TAG}" \
            --notes "Signed release ${TAG} (Build ${VERSION_CODE})" || \
            gh release upload "$TAG" "$APK_OUT" --clobber

          python3 - << PYEOF
          import json
          from pathlib import Path
          p = Path("content_packs/catalog.json")
          cat = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {"packs": []}
          prev = cat.get("appUpdate") or {}
          cat["appUpdate"] = {
              "latestVersionCode": ${VERSION_CODE},
              "latestVersionName": "${VERSION_NAME}",
              "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK_OUT}",
              "releaseNotesEn": prev.get("releaseNotesEn") or "New games, improvements, and bug fixes.",
              "releaseNotesMy": prev.get("releaseNotesMy") or "ဂိမ်းအသစ်များနှင့် တိုးတက်ပြင်ဆင်ချက်အသစ်များ ပါဝင်ပါသည်။",
              "forceUpdate": bool(prev.get("forceUpdate", False)),
          }
          p.write_text(json.dumps(cat, ensure_ascii=False, indent=2), encoding="utf-8")
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_packs/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update appUpdate to ${TAG} [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
