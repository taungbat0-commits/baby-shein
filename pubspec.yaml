name: baby_shein
description: Offline-first bilingual English learning application for Myanmar Grade 1 and Grade 2 children.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  confetti: ^0.7.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/baby.png"
  adaptive_icon_background: "#E3F4FF"
  adaptive_icon_foreground: "assets/images/baby.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
    - assets/images/
    - assets/animations/
